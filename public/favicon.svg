<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="silverGrad" x1="10" y1="5" x2="55" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="amethystGem" x1="28" y1="20" x2="48" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0CEF8" />
      <stop offset="40%" stop-color="#9B6BE8" />
      <stop offset="100%" stop-color="#6839C2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crescent Moon with Filigree Arch -->
  <path d="M42 8C27.64 8 16 19.64 16 34C16 48.36 27.64 60 42 60C33.5 54 28 44 28 34C28 24 33.5 14 42 8Z" 
        fill="url(#silverGrad)" 
        stroke="#FFFFFF" 
        stroke-width="1.2" />

  <!-- Faceted Amethyst Gem in Crescent Core -->
  <g transform="translate(36, 32)" filter="url(#glow)">
    <!-- Gem Facets -->
    <polygon points="0,-10 8,-4 0,11 -8,-4" fill="url(#amethystGem)" stroke="#E0CEF8" stroke-width="0.8" />
    <polygon points="0,-10 0,11 8,-4" fill="#8247E5" opacity="0.6" />
    <polygon points="0,-10 -8,-4 0,0" fill="#E9D5FF" opacity="0.8" />
    <polygon points="0,0 8,-4 0,11" fill="#6839C2" opacity="0.7" />
  </g>

  <!-- Sparkle Stars -->
  <path d="M48 18L49.5 22L53.5 23.5L49.5 25L48 29L46.5 25L42.5 23.5L46.5 22Z" fill="#FBF9FF" />
  <circle cx="22" cy="18" r="1.5" fill="#E0CEF8" />
  <circle cx="18" cy="46" r="1.2" fill="#E0CEF8" />
</svg>
